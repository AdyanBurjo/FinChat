<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <!-- Outer Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="zapGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#39ff14" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#39ff14" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Subtle inner neon border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#neonGlow)" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Chat Bubble Outline -->
  <path d="M16 20 C16 16.686 18.686 14 22 14 H42 C45.314 14 48 16.686 48 20 V34 C48 37.314 45.314 40 42 40 H28 L20 47 V40 H22 C18.686 40 16 37.314 16 34 Z"
        fill="rgba(57, 255, 20, 0.08)"
        stroke="#00f5ff"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round" />

  <!-- Lightning / Zap Symbol (FinChat Signature) -->
  <path d="M34 19 L25 31 H32 L30 43 L41 29 H33 L36 19 Z"
        fill="#39ff14"
        filter="url(#zapGlow)" />
</svg>
